services:
  db:
    image: postgres:16-alpine
    container_name: class12th-prep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    ports:
      - '5432:5432'
    volumes:
      - prep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prep -d prep']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  prep_pgdata:
